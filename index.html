
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rocket AI Content Studio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 20px;
      background: #fff7f5;
      color: #262626;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px #00000010;
    }
    h1 { color: #e44848; }
    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }
    input, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
      font-size: 16px;
    }
    input, select { border: 1px solid #ddd; }
    button {
      border: 0;
      background: #e44848;
      color: white;
      cursor: pointer;
      margin-top: 24px;
    }
    #result {
      white-space: pre-wrap;
      margin-top: 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Rocket AI Content Studio 🚀</h1>
    <p>Create social media content ideas for your business.</p>

    <label for="business">Business type</label>
    <input id="business" placeholder="e.g. Appliance shop">

    <label for="language">Content language</label>
    <select id="language">
      <option>Kannada</option>
      <option>Kanglish</option>
      <option>English</option>
    </select>

    <label for="format">Content format</label>
    <select id="format">
      <option>Instagram Reel Script</option>
      <option>Social Media Caption</option>
      <option>Attention-Grabbing Hooks</option>
      <option>Promotional Video Idea</option>
    </select>

    <button id="generateButton" onclick="generateDraft()">Generate AI Content</button>
    <div id="result" aria-live="polite"></div>
  </div>

  
<script>
  async function generateDraft() {
    const business = document.getElementById('business').value.trim();
    const language = document.getElementById('language').value;
    const format = document.getElementById('format').value;
    const result = document.getElementById('result');

    if (!business) {
      result.textContent = 'Please enter your business type first.';
      return;
    }

    result.textContent = 'Generating your AI content...';
    document.getElementById('generateButton').disabled = true;

    try {
      const response = await fetch(
        'https://round-waterfall-b0a6.kushigowdagreen.workers.dev',
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            business,
            language,
            format,
            details: 'Create engaging social media content for this business.'
          })
        }
      );

      const data = await response.json();

      if (!response.ok || !data.content) {
        throw new Error(data.error || 'Unable to generate content.');
      }

      result.textContent = data.content;
    } catch (error) {
      console.error('Content generation error:', error);
      result.textContent =
        'Sorry, content could not be generated. Please try again.';
    }finally {
  document.getElementById('generateButton').disabled = false;
}
  }
</script>
</body>
</html>
